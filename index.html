<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d9412a">
<title>Reklamlåten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#e7ecf0; --card:#ffffff; --fg:#14202a; --muted:#5a6b78; --line:#cdd6dd;
  --accent:#d9412a; --accent-ink:#ffffff; --ok:#1f8a4c; --bad:#c2332b; --okbg:#e2f3e8; --badbg:#fbe5e2;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f171d; --card:#18232c; --fg:#e8eef2; --muted:#93a4b1; --line:#2a3945;
  --accent:#ff6a4d; --accent-ink:#1a0d0a; --ok:#4cc982; --bad:#ff7a6e; --okbg:#173327; --badbg:#3a1f1d; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:16px;line-height:1.45;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
main{max-width:520px;margin:0 auto;padding-block:20px 32px;display:flex;flex-direction:column;gap:18px;min-height:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:800;font-size:1.35rem;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.onair{font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:3px 7px;border-radius:4px}
.stats{font-family:var(--mono);font-size:.8rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.stats b{color:var(--fg);font-weight:500}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.screen{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0 3px,color-mix(in srgb,var(--fg) 4%,transparent) 3px 4px)}
.label{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.song{font-weight:800;font-size:clamp(1.7rem,7vw,2.3rem);line-height:1.05;letter-spacing:-.025em;text-wrap:balance;margin:0}
.artist{font-size:1.05rem;color:var(--muted);margin:0}
.hiddenname{color:var(--muted)}
.player{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.play{width:64px;height:64px;flex:none;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:grid;place-items:center}
.play svg{width:26px;height:26px;fill:currentColor}
.play:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.eq{display:flex;align-items:flex-end;gap:3px;height:28px}
.eq i{width:5px;background:var(--accent);border-radius:2px;height:30%}
.playing .eq i{animation:eq .9s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}.eq i:nth-child(4){animation-delay:-.15s}.eq i:nth-child(5){animation-delay:-.45s}
@keyframes eq{from{height:20%}to{height:100%}}
.pstate{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.listen{align-self:flex-start;font-family:var(--mono);font-size:.78rem;color:var(--accent);text-decoration:none;border-bottom:1px solid currentColor;position:relative;z-index:1}
.q{font-weight:500;margin:0}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font:inherit;font-size:1.05rem;font-weight:500;text-align:left;color:var(--fg);background:var(--card);border:2px solid var(--line);border-radius:14px;
  padding:16px;min-height:58px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color .15s,transform .1s}
.opt .k{font-family:var(--mono);font-size:.8rem;width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:50%;border:1.5px solid var(--line);color:var(--muted)}
.opt:active{transform:scale(.98)}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:var(--okbg)} .opt.ok .k{border-color:var(--ok);color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badbg)} .opt.bad .k{border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default} .opt.dim{opacity:.55}
.fact{border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin:0}
.fact strong{display:block;font-size:1.1rem}
.btn{font:inherit;font-weight:800;font-size:1.1rem;background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:16px;cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--line);font-weight:500}
.btn:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.row{display:flex;gap:10px} .row>*{flex:1}
.big{font-weight:800;font-size:clamp(3rem,16vw,4.5rem);line-height:1;letter-spacing:-.04em;margin:0;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);margin:0}
.lead{font-size:1.05rem;margin:0}
.toggle{display:flex;gap:8px}
.toggle button{flex:1;font:inherit;font-family:var(--mono);font-size:.85rem;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.toggle button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.foot{font-family:var(--mono);font-size:.72rem;color:var(--muted);text-align:center;margin-top:auto}
/* Spotify-spelaren: gömd utanför skärmen, eller synlig med skymd titel som reserv */
#spWrap{position:fixed;left:-9999px;top:0;width:300px;height:80px;overflow:hidden}
#spWrap.fallback{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:auto;max-width:488px;margin:0 auto;border-radius:12px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#spWrap.fallback::after{content:"Tryck på ▶ till höger";position:absolute;inset:0 76px 0 0;display:flex;align-items:center;padding-left:16px;
  font-family:var(--mono);font-size:.8rem;color:var(--fg);background:var(--card);border:1px solid var(--line);border-right:0;border-radius:12px 0 0 12px;pointer-events:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="logo">Reklamlåten <span class="onair">i rutan</span></div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="bar" id="barWrap" hidden><i id="bar"></i></div>
  <div id="view"></div>
  <div id="spWrap"></div>
  <p class="foot" id="foot">30 låtar från svensk reklam · musik via Spotify</p>
</main>

<script>
const LIB = [
 {"s": "Release Me", "a": "Oh Laura", "b": "Saab", "u": "track:5hbT8Shc4T0nskc23XCd2P", "f": "Reklamen för Saab 9-3 BioPower."},
 {"s": "Dina färger var blå", "a": "Tommy Nilsson", "b": "Pripps Blå", "u": "track:00IRhIiynu3eZjVaegnJ2h", "f": ""},
 {"s": "Strövtåg i hembygden", "a": "Mando Diao", "b": "Volvo", "u": "track:5gzslnn0fGkJnMz2IbyMw7", "f": "Texten är en dikt av Gustaf Fröding."},
 {"s": "Du gamla, du fria", "a": "Nationalsången", "b": "Volvo XC70", "u": "track:4hrTD01XIZeh2EcfieDPot", "f": "Zlatan läser nationalsången i ”Made by Sweden”."},
 {"s": "Monument", "a": "Röyksopp & Robyn", "b": "Volvo", "u": "track:752fLM4h8ksSIfW6FESo3m", "f": "Robyn medverkade i reklamen för Volvos miljömotorer."},
 {"s": "Feeling Good", "a": "Avicii", "b": "Volvo", "u": "track:13U5wDInU5sbw0VTD6gM54", "f": "Avicii medverkade själv i Volvos ”Made by Sweden”."},
 {"s": "Nu stannar vi på marken", "a": "Veronica Maggio", "b": "SJ", "u": "track:6AmXtz8CoUpH0AXvRSucLx", "f": "Veronica Maggio medverkade själv i reklamen."},
 {"s": "\"Heroes\"", "a": "David Bowie", "b": "SJ", "u": "track:7Jh1bpe76CNTCgdgAdBw4Z", "f": "Miljöhjältar som väljer tåget framför andra färdmedel."},
 {"s": "I Don't Like Mondays", "a": "The Boomtown Rats", "b": "SJ", "u": "track:3Xi3mWUFoysfreJKGW136J", "f": "Reklamen om att resa utan pappersbiljett."},
 {"s": "Your Song", "a": "Billy Paul", "b": "Fritidsresor", "u": "track:35Rz0iAqsz7HASZISPGdhq", "f": "En cover på Elton Johns låt. Fritidsresor heter numera TUI."},
 {"s": "Vita vidder", "a": "Family Four", "b": "ICA", "u": "track:0ehUFPGdCJKpjAd8U6jhF3", "f": "Ulf och Jerry drar på sportlov."},
 {"s": "Mr. Lonely", "a": "Bobby Vinton", "b": "ICA", "u": "track:1PgYN6hOBCpnftBXE1dCux", "f": "Julreklamen där ingen vill ha lutfisken."},
 {"s": "Tonight", "a": "Lykke Li", "b": "Barncancerfonden", "u": "track:4J62Bt8QkWJVAVjVIH3afA", "f": ""},
 {"s": "Sarkofag", "a": "Miriam Bryant", "b": "Cancerfonden", "u": "track:2vMkfB2NRWj0t7kmMaBL3c", "f": ""},
 {"s": "Sun Is Shining", "a": "Axwell Λ Ingrosso", "b": "H&M", "u": "track:1580WHAIdU1IBFFElYpOxx", "f": ""},
 {"s": "Girl", "a": "SYML", "b": "Comviq", "u": "track:6zP2bIJWqFZtJ8dtxeDzcp", "f": ""},
 {"s": "Vilken värld", "a": "Dolce", "b": "Telia", "u": "track:4zldsipMcOS11ZwZewr6l2", "f": "Telias reklam med surfare som aldrig tar slut på vågor."},
 {"s": "Walk With Me", "a": "Loreen", "b": "Ellos", "u": "track:3fEkgOecRugogzQAAp6Oxi", "f": ""},
 {"s": "True Colors", "a": "Ane Brun", "b": "Björn Borg", "u": "track:54EtQECBgqzbTWJmn3vFhJ", "f": ""},
 {"s": "Smalltown Boy", "a": "Sanders Bohlke", "b": "IKEA", "u": "track:4HDjCPBvHmdWMRWLwncQyD", "f": "En cover på Bronski Beats låt."},
 {"s": "In the Summertime", "a": "Mungo Jerry", "b": "Tre", "u": "track:3RNyGLgSvmVRZ7xKUp8Wgd", "f": ""},
 {"s": "My Silver Lining", "a": "First Aid Kit", "b": "Renault", "u": "track:0qSuuceD4wuPXVnc2ncykA", "f": ""},
 {"s": "Sunshine", "a": "Teddybears", "b": "Peugeot", "u": "track:6dLQxGRZHTBdPqFuQg3Vva", "f": ""},
 {"s": "Push It", "a": "Salt-N-Pepa", "b": "Unibet", "u": "track:6sT9MWlJManry3EQwf4V80", "f": ""},
 {"s": "This Is the Way", "a": "E-Type", "b": "Kronfågel", "u": "track:1BBIW3lDfwK9PXOFOedZmo", "f": ""},
 {"s": "Sing Hallelujah!", "a": "Dr. Alban", "b": "Plantagen", "u": "track:2WGiUwhVQGlBi8YSwWLjT1", "f": ""},
 {"s": "Hints", "a": "José González", "b": "Rädda Barnen", "u": "track:3s9lARH9JA4JqJaarFM1Yy", "f": ""},
 {"s": "I'm an Albatraoz", "a": "AronChupa", "b": "Hyundai", "u": "track:5MhsZlmKJG6X5kTHkdwC4B", "f": ""},
 {"s": "Ålen", "a": "Amason", "b": "Trygg-Hansa", "u": "track:7tNN8qhB5JHGmDTD9MHwAX", "f": ""},
 {"s": "Heartbeats", "a": "José González", "b": "Sony Bravia", "u": "track:6Z0rymu2z30a3fUPUZwykr", "f": "Studsbollar nerför en backe i San Francisco. Låten är en cover på The Knife."}
];

/* ---------- Spotify ----------
   En ny spelare skapas för varje låt. Att byta låt i samma spelare
   (loadUri) fungerade inte pålitligt i mobilwebbläsare. */
let API=null, sp=null, gen=0, playing=false, wantUri=null, pendingPlay=false, startTimer=null, playTimer=null;
window.onSpotifyIframeApiReady = api => { API=api; if(wantUri) build(wantUri); };
function build(uri){
  const my=++gen;
  if(sp){ try{sp.pause()}catch(e){} try{sp.destroy()}catch(e){} sp=null; }
  const host=document.getElementById("spWrap");
  host.innerHTML='<div id="sp"></div>';
  playing=false; paintPlayer();
  API.createController(document.getElementById("sp"), {width:"100%", height:80, uri}, c => {
    if(my!==gen){ try{c.destroy()}catch(e){} return; }
    sp=c;
    c.addListener("ready",()=>{ if(my===gen && pendingPlay){pendingPlay=false;clearTimeout(playTimer);c.play();} });
    c.addListener("playback_update",e=>{
      if(my!==gen) return;
      const d=e.data; playing=!d.isPaused && !d.isBuffering;
      if(playing && d.position>0){clearTimeout(startTimer);hideFallback();}
      paintPlayer();
    });
    if(pendingPlay){ clearTimeout(playTimer); playTimer=setTimeout(()=>{ if(my===gen && pendingPlay){pendingPlay=false;c.play();} },1500); }
  });
}
function loadSong(it,autoplay){
  wantUri="spotify:"+it.u; pendingPlay=autoplay;
  if(API) build(wantUri);
  if(autoplay) armFallback();
}
function togglePlay(){
  if(!sp){ pendingPlay=true; setState("Spotify laddar…"); armFallback(); return; }
  if(playing){sp.pause();playing=false;paintPlayer();return}
  sp.play(); armFallback();
}
function stopMusic(){ if(sp){ try{sp.pause()}catch(e){} } }
function armFallback(){clearTimeout(startTimer);startTimer=setTimeout(()=>{if(!playing)showFallback()},4500)}
function showFallback(){$("spWrap").classList.add("fallback")}
function hideFallback(){$("spWrap").classList.remove("fallback")}
function setState(t){const el=document.getElementById("pstate");if(el)el.textContent=t}
function paintPlayer(){
  const p=document.getElementById("player"); if(!p) return;
  p.classList.toggle("playing",playing);
  document.getElementById("playIcon").innerHTML = playing ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  document.getElementById("playBtn").setAttribute("aria-label",playing?"Pausa":"Spela låten");
  setState(playing?"Spelar…":"Tryck för att spela");
}

/* ---------- Spelet ---------- */
const brandKey=b=>b.split(/[ (]/)[0].replace("'s","");
const $=id=>document.getElementById(id);
const view=$("view");
let best=0; try{best=+localStorage.getItem("rl_best")||0}catch(e){}
let len=10, deck=[], i=0, score=0, streak=0;
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]}return a}
/* Falska alternativ: svenska varumärken som inte är rätt svar på frågan */
const DECOYS=["Arla","Marabou","Coop","Willys","Lidl","Systembolaget","Spotify","Klarna","Swish","Folksam",
 "Länsförsäkringar","Swedbank","Handelsbanken","SEB","Nordea","Apotek Hjärtat","Kicks","Lindex","KappAhl",
 "Clas Ohlson","Biltema","Jula","Elgiganten","Postnord","Scania","Polestar","Absolut Vodka","Loka","Ramlösa",
 "OLW","Estrella","Cloetta","Göteborgs Kex","Felix","Gevalia","Zoégas","Oatly","Max Hamburgare","Pressbyrån",
 "Apoteket","Tele2","Telenor","Hemglass","Viaplay","SAS","Hemnet","Blocket","Dressmann","Stadium",
 "Lantmännen","Bregott","Kalles Kaviar","Pågen","Skånemejerier","Mer","Fazer","Ving","Apollo","Svenska Spel",
 "ATG","Fortum","Vattenfall","Securitas","Sector Alarm","If Försäkringar","Ica Banken","Volkswagen","Toyota"];
let pool=[];
function refillPool(){
  const all=[...new Set([...DECOYS,...LIB.map(x=>x.b)])];
  pool=shuffle(all);
}
function options(item){
  const k=brandKey(item.b), picks=[];
  let guard=0;
  while(picks.length<2 && guard++<400){
    if(!pool.length) refillPool();
    const c=pool.shift();
    if(brandKey(c)===k || picks.some(p=>brandKey(p)===brandKey(c))){ pool.push(c); continue; }
    picks.push(c);
  }
  return shuffle([item.b,...picks]);
}
function esc(t){return t.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function stats(){
  $("stats").innerHTML=deck.length?`Poäng <b>${score}</b> · Svit <b>${streak}</b>`:`Rekord <b>${best}</b>`;
  $("bar").style.width=deck.length?(i/deck.length*100)+"%":"0";
}
function home(){
  stopCountdown();
  deck=[];stats();$("barWrap").hidden=true;$("foot").hidden=false;
  stopMusic();
  view.innerHTML=`<div style="display:flex;flex-direction:column;gap:18px">
    <div class="screen">
      <span class="label">Nu spelas</span>
      <p class="song">Vilken reklam hör låten till?</p>
      <p class="artist">Lyssna på låten och välj vilken svensk reklamfilm den hördes i. Titeln visas först när du svarat.</p>
    </div>
    <div><p class="label" style="margin:0 0 8px">Antal låtar</p>
      <div class="toggle" role="group" aria-label="Antal låtar">
        ${[10,20,30].map(n=>`<button type="button" id="len${n}" aria-pressed="${n===len}">${n} låtar</button>`).join("")}
      </div></div>
    <button class="btn" id="start">Starta</button>
    <p class="sub" style="font-size:.9rem">Logga in på Spotify i webbläsaren för hela låtar, annars spelas 30 sekunder.</p>
  </div>`;
  [10,20,30].forEach(n=>$("len"+n).onclick=()=>{len=n;home()});
  $("start").onclick=start;
}
function start(){refillPool();deck=shuffle(LIB).slice(0,len);i=0;score=0;streak=0;$("barWrap").hidden=false;$("foot").hidden=true;round(true)}
function round(autoplay){
  stats();
  const it=deck[i], opts=options(it);
  view.innerHTML=`<div style="display:flex;flex-direction:column;gap:16px">
    <div class="screen">
      <span class="label">Låt ${i+1} av ${deck.length}</span>
      <p class="song hiddenname" id="title">? ? ?</p>
      <p class="artist" id="artist">Lyssna och gissa</p>
      <div class="player" id="player">
        <button class="play" id="playBtn" aria-label="Spela låten"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
        <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <span class="pstate" id="pstate">Tryck för att spela</span>
      </div>
    </div>
    <p class="q">Vilken reklam använde låten?</p>
    <div class="opts">${opts.map((o,k)=>`<button class="opt" id="o${k}" data-b="${esc(o)}"><span class="k">${"ABC"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    <div id="after"></div>
  </div>`;
  $("playBtn").onclick=togglePlay;
  opts.forEach((o,k)=>$("o"+k).onclick=()=>answer(o));
  hideFallback();
  loadSong(it,autoplay);
}
let countdown=null;
function stopCountdown(){clearInterval(countdown);countdown=null}
function answer(pick){
  const it=deck[i], right=pick===it.b;
  if(right){streak++;score+=10+Math.min(streak-1,5)*2}else streak=0;
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;
    if(b.dataset.b===it.b)b.classList.add("ok");else if(b.dataset.b===pick)b.classList.add("bad");else b.classList.add("dim")});
  $("title").textContent=it.s;$("title").classList.remove("hiddenname");$("artist").textContent=it.a;
  i++;stats();
  const last=i>=deck.length;
  $("after").innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">
    <p class="fact"><strong>${right?"Rätt!":"Fel – det var "+esc(it.b)}</strong>${esc(it.f)}</p>
    <div class="row">
      <button class="btn" id="next">${last?"Se resultat":"Nästa låt"}</button>
      ${last?"":`<button class="btn ghost" id="hold">Vänta</button>`}
    </div>
    ${last?"":`<p class="sub" id="cd" style="font-family:var(--mono);font-size:.8rem"></p>`}</div>`;
  $("next").onclick=()=>{stopCountdown(); last?end():round(true)};
  if(!last){
    let n=6; const tick=()=>{ $("cd").textContent=`Nästa låt startar om ${n} s`; if(n--<=0){stopCountdown();round(true);} };
    tick(); countdown=setInterval(tick,1000);
    $("hold").onclick=()=>{stopCountdown(); $("hold").hidden=true; $("cd").textContent="Tryck på Nästa låt när du är redo";};
  }
}
function end(){
  stopMusic();
  const max=deck.length,pct=score/(max*20);
  const isBest=score>best;if(isBest){best=score;try{localStorage.setItem("rl_best",best)}catch(e){}}
  const msg=pct>.7?"Du är en vandrande reklampaus.":pct>.4?"Bra öra för reklam!":"Dags att titta mer på tv.";
  $("barWrap").hidden=true;hideFallback();
  view.innerHTML=`<div style="display:flex;flex-direction:column;gap:18px">
    <div class="screen">
      <span class="label">Slut på reklampausen</span>
      <p class="big">${score}</p>
      <p class="sub">poäng på ${max} låtar${isBest?" · nytt rekord!":""}</p>
      <p class="lead">${msg}</p>
    </div>
    <div class="row"><button class="btn" id="again">Spela igen</button><button class="btn ghost" id="menu">Meny</button></div>
  </div>`;
  deck=[];stats();
  $("again").onclick=start;$("menu").onclick=home;
}
home();
</script>
<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</body>
